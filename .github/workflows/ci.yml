name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
      WANDB_MODELS: ${{ secrets.WANDB_MODELS }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build --platform linux/amd64 -t intent-clf:ci .

  smoke:
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build --platform linux/amd64 -t intent-clf:smoke .

      - name: Iniciar API
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
          WANDB_MODELS: ${{ secrets.WANDB_MODELS }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          docker run -d --name intent-clf-smoke \
            -p 8000:8000 \
            -e WANDB_API_KEY \
            -e WANDB_PROJECT \
            -e WANDB_MODELS \
            -e MONGO_URL \
            intent-clf:smoke

      - name: Aguardar inicializacao e testar API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/; then
              echo "API iniciada com sucesso"
              exit 0
            fi
            sleep 10
          done

          docker logs intent-clf-smoke
          exit 1

      - name: Testar predicao
        run: |
          curl --fail-with-body -X POST \
            http://localhost:8000/predictions \
            -H "Content-Type: application/json" \
            -d '{"nome":"ci","text":"não entendi nada"}'

      - name: Logs em caso de falha
        if: failure()
        run: docker logs intent-clf-smoke
