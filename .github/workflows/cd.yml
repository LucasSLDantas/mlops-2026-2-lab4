name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versao existente para implantar (ex.: v1.0.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: intent-clf
  RESOURCE_GROUP: mlops-2026-2
  IMAGE: ghcr.io/lucassldantas/mlops-2026-2-lab4
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Publicar imagem no GHCR
    needs: ci
    if: github.event_name == 'push' && needs.ci.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

  deploy:
    name: Implantar no Azure
    needs: [ci, release]
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && needs.release.result == 'success') ||
          (github.event_name == 'workflow_dispatch')
        )
      }}
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login no Azure com OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar Container App
        shell: bash
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$TAG" \
            --set-env-vars APP_VERSION="$TAG"

  verify:
    name: Verificar implantacao
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verificar versao publicada
        env:
          APP_URL: ${{ vars.APP_URL }}
        shell: bash
        run: |
          if [ -z "$APP_URL" ]; then
            echo "ERRO: configure a variavel APP_URL no GitHub."
            exit 1
          fi

          for i in $(seq 1 90); do
            RESPONSE=$(curl -fsS --max-time 15 "$APP_URL/" || true)

            if echo "$RESPONSE" | python3 -c \
              'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status")=="ok" and d.get("version")==sys.argv[1] else 1)' \
              "$TAG" 2>/dev/null; then
              echo "OK: $TAG no ar"
              exit 0
            fi

            echo "Aguardando versao $TAG (tentativa $i/90)"
            sleep 10
          done

          echo "ERRO: versao $TAG nao encontrada."
          exit 1

      - name: Testar predicao
        env:
          APP_URL: ${{ vars.APP_URL }}
        shell: bash
        run: |
          curl --fail-with-body --retry 3 \
            --max-time 120 \
            -X POST "$APP_URL/predictions" \
            -H "Content-Type: application/json" \
            -d '{
              "id": "cd-verification",
              "nome": "github-actions",
              "text": "Gostaria de saber o preco de um produto",
              "timestamp": "2026-11-17T12:00:00Z"
            }'
